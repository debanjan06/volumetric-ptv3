name: Deep Learning Pipeline CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality_and_test_suite:
    name: Code Quality & Optimization Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache Pip Dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install Deep Learning Tools
      run: |
        python -m pip install --upgrade pip
        pip install ruff pytest numpy
        # Install CPU-specific PyTorch to keep the runner lightweight and fast
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Linting and Code Style Checks (Ruff)
      run: ruff check .

    - name: Verify Code Formatting Alignment
      run: ruff format --check .

    - name: Execute Model and Quantization Tests
      run: pytest src/ -o python_files="*_test.py" --verbose